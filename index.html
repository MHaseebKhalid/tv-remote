<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TV Remote">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111118'/%3E%3Crect x='14' y='18' width='36' height='24' rx='4' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Cpath d='M26 48h12' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23111118'/%3E%3Crect x='40' y='50' width='100' height='66' rx='10' fill='none' stroke='%23fff' stroke-width='10'/%3E%3Cpath d='M72 134h36' stroke='%23fff' stroke-width='10' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Living Room Remote</title>
<style>
/* Layout: one narrow column, now-playing deck on top, lists below. Single dark look, like the TV's Home. */
:root{
  --bg:#0b0b10; --card:#15151d; --card2:#1f1f2a; --line:#2b2b38; --fg:#f3f3f7; --dim:#9b9bab; --accent:#ffffff; --ok:#5fd18b; --bad:#ff7a7a;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.35 var(--ui)}
body{padding-block:max(16px,env(safe-area-inset-top)) calc(28px + env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:520px;margin:0 auto}
[hidden]{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
.top h1{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);background:var(--card);border-radius:999px;padding:5px 10px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.dot.on{background:var(--ok)} .dot.off{background:var(--bad)}
.card{background:var(--card);border-radius:22px;padding:16px}
.now{display:flex;gap:14px;align-items:center}
.badge{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff;flex:none;background:var(--card2)}
.now .t{font-size:18px;font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.now .s{color:var(--dim);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;background:var(--line);border-radius:4px;margin:14px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:4px;transition:width .4s linear}
.times{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums;min-height:15px}
.controls{display:flex;justify-content:space-between;align-items:center;margin:18px 4px 6px}
button{font:inherit;color:var(--fg);background:var(--card2);border:0;border-radius:999px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.94)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:56px;height:56px;display:grid;place-items:center}
.ic svg{width:26px;height:26px;fill:currentColor}
.play{width:80px;height:80px;background:var(--accent);color:#000}
.play svg{width:36px;height:36px}
.vol{display:flex;gap:10px;margin-top:14px}
.vol button{flex:1;height:48px;font-size:15px}
.vol .lvl{flex:1.2;display:grid;place-items:center;color:var(--dim);font-size:14px;font-variant-numeric:tabular-nums}
.wide{width:100%;height:46px;margin-top:12px;font-size:15px}
.tabs{display:flex;gap:6px;background:var(--card);border-radius:999px;padding:4px;margin:22px 0 12px}
.tabs button{flex:1;height:40px;background:transparent;font-size:15px;color:var(--dim)}
.tabs button[aria-selected="true"]{background:var(--card2);color:var(--fg)}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--card);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center}
.row .badge{width:40px;height:40px;border-radius:10px;font-size:15px}
.row .m{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .p{height:3px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.row .p i{display:block;height:100%;background:var(--dim)}
.acts{display:flex;gap:6px;flex:none}
.acts button{width:40px;height:40px;display:grid;place-items:center;font-size:16px}
.empty{color:var(--dim);text-align:center;padding:26px 8px;font-size:14px}
.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.apps button{border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;gap:8px;align-items:center;font-size:12px;color:var(--dim)}
.apps .badge{width:48px;height:48px}
form.new{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
input,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
.link{background:none;color:var(--dim);font-size:13px;padding:8px;margin:8px auto 0;display:block}
#pair{text-align:center;padding-top:10vh}
#pair p{color:var(--dim);max-width:34ch;margin:10px auto 0}
#code{font-size:22px;letter-spacing:.14em;text-align:center;text-transform:uppercase;max-width:330px;margin:22px auto 14px;display:block;font-variant-numeric:tabular-nums}
.primary{height:52px;padding:0 36px;background:var(--accent);color:#000;font-weight:600}
.err{color:var(--bad);margin-top:14px;min-height:20px;font-size:14px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:end center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.sheet .card{width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px}
.sheet .row2{display:flex;gap:8px}.sheet .row2 button{flex:1;height:46px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(140px);background:#2c2c38;padding:10px 18px;border-radius:999px;font-size:14px;transition:transform .25s}
.toast.on{transform:translateX(-50%) translateY(0)}
.off{opacity:.5}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<section id="pair" hidden>
  <div class="top" style="justify-content:center"><h1>Living Room Remote</h1></div>
  <p>Open <b>Phone Remote</b> on the TV and type the remote code it shows (16 letters and digits).</p>
  <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="19">
  <button class="primary" id="pairBtn">Connect</button>
  <div class="err" id="pairErr"></div>
</section>

<section id="app" hidden>
  <div class="top"><h1>Living Room</h1><span class="pill"><span class="dot" id="dot"></span><span id="conn">Connecting…</span></span></div>
  <div class="card" id="nowCard">
    <div class="now">
      <div class="badge" id="nowBadge">TV</div>
      <div style="min-width:0;flex:1"><div class="t" id="nowTitle">Waiting for the TV…</div><div class="s" id="nowSub"></div></div>
    </div>
    <div class="bar"><i id="nowBar"></i></div>
    <div class="times"><span id="tPos"></span><span id="tDur"></span></div>
    <div class="controls">
      <button class="ic" data-cmd="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="ic" data-cmd="back" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg></button>
      <button class="ic play" data-cmd="toggle" aria-label="Play or pause"><svg viewBox="0 0 24 24" id="playIco"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="ic" data-cmd="fwd" aria-label="Forward 10 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/></svg></button>
      <button class="ic" data-cmd="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zm10-12v12h2V6z"/></svg></button>
    </div>
    <div class="vol">
      <button data-cmd="voldown">− Vol</button>
      <div class="lvl" id="volLvl">–</div>
      <button data-cmd="volup">Vol +</button>
      <button data-cmd="mute" id="muteBtn">Mute</button>
    </div>
    <button class="wide" id="saveNow">＋ Watch later</button>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="history" aria-selected="true">History</button>
    <button role="tab" data-tab="later" aria-selected="false">Watch later</button>
    <button role="tab" data-tab="apps" aria-selected="false">Apps</button>
  </div>
  <div id="tab-history"><div class="list" id="historyList"></div><button class="link" id="clearHist" hidden>Clear history</button></div>
  <div id="tab-later" hidden>
    <form class="new" id="laterForm">
      <input id="lTitle" placeholder="Title, e.g. The Bear S3" maxlength="200">
      <input id="lUrl" placeholder="Link (optional, e.g. a YouTube link)" maxlength="500">
      <select id="lPkg"><option value="">Which app?</option></select>
      <button class="wide" type="submit" style="margin-top:0">Add to watch later</button>
    </form>
    <div class="list" id="laterList"></div>
  </div>
  <div id="tab-apps" hidden><div class="apps" id="appsGrid"></div></div>
  <button class="link" id="forget">Disconnect this phone</button>
</section>
</main>

<div class="sheet" id="sheet" hidden>
  <form class="card" id="sheetForm">
    <div id="sheetMsg" style="font-weight:600"></div>
    <input id="sheetInput" maxlength="200">
    <div class="row2"><button type="button" id="sheetCancel">Cancel</button><button type="submit" class="primary" style="padding:0">Save</button></div>
  </form>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';
  const RELAY = 'https://ntfy.sh/';
  const $ = id => document.getElementById(id);
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
                  del(k) { try { localStorage.removeItem(k); } catch (e) {} } };

  let key = null, base = null, es = null, snap = null, snapAt = 0, lastMsgAt = 0, pending = null, tab = 'history';
  let apps = []; try { apps = JSON.parse(store.get('apps') || '[]'); } catch (e) {}

  // ---------- crypto: same scheme as the TV app (Relay.java) ----------
  const te = new TextEncoder(), td = new TextDecoder();
  const norm = c => c.toUpperCase().replace(/[^A-Z0-9]/g, '');
  const sha = async s => new Uint8Array(await crypto.subtle.digest('SHA-256', te.encode(s)));
  const hex = b => [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  const b64 = u => { let s = ''; u.forEach(c => s += String.fromCharCode(c)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s.trim()), c => c.charCodeAt(0));
  async function setup(code) {
    const c = norm(code);
    base = 'tvr' + hex((await sha('tvremote-topic:' + c)).slice(0, 12));
    key = await crypto.subtle.importKey('raw', await sha('tvremote-key:' + c), 'AES-GCM', false, ['encrypt', 'decrypt']);
  }
  async function enc(obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(JSON.stringify(obj))));
    const all = new Uint8Array(12 + ct.length); all.set(iv); all.set(ct, 12); return b64(all);
  }
  async function dec(s) {
    const all = unb64(s);
    return JSON.parse(td.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: all.slice(0, 12) }, key, all.slice(12))));
  }

  // ---------- transport ----------
  async function send(path, body, method) {
    const r = Math.random().toString(36).slice(2, 10);
    const msg = await enc({ t: Date.now(), r, m: method || 'POST', p: path, b: body || {} });
    let res = null, lastErr = null;
    for (let attempt = 0; attempt < 3 && !res; attempt++) {
      try { res = await fetch(RELAY + base + 'c', { method: 'POST', body: msg }); }
      catch (e) { lastErr = e; await new Promise(ok => setTimeout(ok, 800 * (attempt + 1))); }
    }
    if (!res) throw new Error('No internet connection to the relay. Try again.');
    if (!res.ok) throw new Error(res.status === 429 ? 'Too many requests to the relay; wait a minute.' : 'Relay error ' + res.status);
    return new Promise(resolve => {
      clearTimeout(pending?.timer);
      pending = { r, resolve, timer: setTimeout(() => { if (pending?.r === r) { pending = null; setConn(false); resolve(null); } }, 20000) };
    });
  }
  function listen() {
    if (es) es.close();
    es = new EventSource(RELAY + base + 's/sse?since=latest');
    es.onmessage = async ev => {
      let m; try { m = await dec(JSON.parse(ev.data).message); } catch (e) { return; }
      lastMsgAt = Date.now();
      if (m.a) { apps = m.a.filter(a => a.pkg !== 'com.gathin.tvhome'); store.set('apps', JSON.stringify(apps)); renderApps(); return; }
      if (!m.s) return;
      if (!snap || m.t >= snapAt) { snap = m; snapAt = m.t; render(); }
      if (Date.now() - m.t < 120000) setConn(true);
      if (pending && m.r === pending.r) { clearTimeout(pending.timer); const p = pending; pending = null; setConn(true); p.resolve(m); }
    };
    es.onerror = () => {}; // EventSource reconnects by itself
  }
  function setConn(ok) {
    $('dot').className = 'dot ' + (ok === true ? 'on' : ok === false ? 'off' : '');
    $('conn').textContent = ok === true ? 'TV online' : ok === false ? 'TV not answering' : 'Connecting…';
  }

  // ---------- UI helpers ----------
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const COLORS = { 'com.netflix.ninja': '#e50914', 'com.google.android.youtube.tv': '#ff0033', 'com.amazon.amazonvideo.livingroom': '#1a98ff',
    'com.apple.atve.androidtv.appletv': '#3a3a44', 'com.community.mbox.tv': '#16a34a', 'com.nordvpn.android': '#4687ff', 'com.android.vending': '#01875f' };
  const hue = s => { let h = 0; for (const c of s || '') h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; };
  const badge = (pkg, app) => `<div class="badge" style="background:${COLORS[pkg] || `hsl(${hue(pkg)} 45% 32%)`}">${esc((app || '?').replace(/[^A-Za-z0-9]/g, '').slice(0, 2) || '?')}</div>`;
  const fmt = ms => { if (!(ms >= 0)) return ''; const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
  const ago = t => { const d = (Date.now() - t) / 1000; if (d < 60) return 'just now'; if (d < 3600) return Math.floor(d / 60) + ' min ago';
    if (d < 86400) return Math.floor(d / 3600) + ' h ago'; const n = Math.floor(d / 86400); return n === 1 ? 'yesterday' : n + ' days ago'; };
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2000); }
  function ask(message, value) {
    return new Promise(resolve => {
      $('sheetMsg').textContent = message; $('sheetInput').value = value || ''; $('sheet').hidden = false; $('sheetInput').focus();
      const done = v => { $('sheet').hidden = true; $('sheetForm').onsubmit = null; $('sheetCancel').onclick = null; resolve(v); };
      $('sheetForm').onsubmit = e => { e.preventDefault(); done($('sheetInput').value.trim()); };
      $('sheetCancel').onclick = () => done('');
    });
  }

  // ---------- render ----------
  function render() {
    const st = snap?.s || {}; const on = !!st.active;
    $('nowCard').classList.toggle('off', !on);
    $('nowTitle').textContent = on ? (st.title || st.app) : 'Nothing playing';
    $('nowSub').textContent = on ? [st.subtitle, st.title ? st.app : ''].filter(Boolean).join(' · ') : 'Start something on the TV';
    $('nowBadge').outerHTML = badge(on ? st.pkg : 'tv', on ? st.app : 'TV').replace('class="badge"', 'class="badge" id="nowBadge"');
    $('playIco').innerHTML = on && st.playing ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    $('volLvl').textContent = st.volumeMax ? (st.muted ? 'Muted' : `${st.volume} / ${st.volumeMax}`) : '–';
    $('muteBtn').textContent = st.muted ? 'Unmute' : 'Mute';
    tick();
    renderHistory(); renderLater();
  }
  function tick() {
    const st = snap?.s;
    if (!st || !st.active || !(st.position >= 0)) { $('tPos').textContent = ''; $('tDur').textContent = ''; $('nowBar').style.width = '0'; return; }
    const pos = st.position + (st.playing ? Date.now() - snapAt : 0);
    $('tPos').textContent = fmt(pos); $('tDur').textContent = st.duration > 0 ? fmt(st.duration) : '';
    $('nowBar').style.width = st.duration > 0 ? Math.min(100, pos / st.duration * 100) + '%' : '0';
  }
  function row(item, kind) {
    const pct = item.duration > 0 && item.position >= 0 ? Math.min(100, item.position / item.duration * 100) : 0;
    const sub = kind === 'h' ? [item.app, ago(item.last), item.plays > 1 ? item.plays + '×' : ''].filter(Boolean).join(' · ')
                             : [item.app || (item.url ? 'Link' : ''), 'added ' + ago(item.added)].filter(Boolean).join(' · ');
    const acts = kind === 'h'
      ? `${item.untitled ? '<button data-a="name" aria-label="Name it">✎</button>' : ''}<button data-a="open" aria-label="Open">▶</button><button data-a="later" aria-label="Save to watch later">＋</button><button data-a="del" aria-label="Remove">✕</button>`
      : `<button data-a="open" aria-label="Open">▶</button><button data-a="search" aria-label="Search in the app">⌕</button><button data-a="del" aria-label="Mark watched">✓</button>`;
    return `<div class="row" data-id="${esc(item.id)}">${badge(item.pkg, item.app)}<div class="m"><div class="t">${esc(item.title)}</div><div class="s">${esc(sub)}</div>${pct ? `<div class="p"><i style="width:${pct}%"></i></div>` : ''}</div><div class="acts">${acts}</div></div>`;
  }
  function renderHistory() {
    const h = snap?.h || [];
    $('historyList').innerHTML = h.length ? h.map(i => row(i, 'h')).join('')
      : '<div class="empty">Nothing yet. What you play on the TV shows up here (YouTube, Netflix, Prime Video, MovieBox and most players).</div>';
    $('clearHist').hidden = !h.length;
  }
  function renderLater() {
    const l = snap?.l || [];
    $('laterList').innerHTML = l.length ? l.map(i => row(i, 'l')).join('') : '<div class="empty">Your watch-later list is empty. Save what is playing, a history item, or add a title above.</div>';
  }
  function renderApps() {
    $('appsGrid').innerHTML = apps.length ? apps.map(a => `<button data-pkg="${esc(a.pkg)}">${badge(a.pkg, a.app)}${esc(a.app)}</button>`).join('') : '<div class="empty">Loading apps…</div>';
    const sel = $('lPkg'); while (sel.options.length > 1) sel.remove(1); apps.forEach(a => sel.add(new Option(a.app, a.pkg)));
  }

  // ---------- actions ----------
  async function act(path, body, okMsg, failMsg, method) {
    try { const r = await send(path, body, method); if (r === null) toast('The TV did not answer. Is it on?'); else if (okMsg || failMsg) toast(r.ok ? okMsg : failMsg); return r; }
    catch (e) { toast(e.message); setConn(false); return null; }
  }
  document.querySelectorAll('[data-cmd]').forEach(b => b.addEventListener('click', () => {
    if (navigator.vibrate) navigator.vibrate(10);
    act('/api/cmd', { action: b.dataset.cmd }, '', 'Nothing to control');
  }));
  $('saveNow').onclick = async () => {
    let title = '';
    if (snap?.s?.active && !snap.s.title) { title = await ask(`${snap.s.app} doesn't say what's playing. Title to save?`); if (!title) return; }
    act('/api/later/add', { fromNow: true, title }, 'Saved to watch later', 'Nothing playing to save');
  };
  $('historyList').addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return; const id = b.closest('.row').dataset.id;
    if (b.dataset.a === 'open') act('/api/open', { history: id, search: true }, 'Opening on the TV', 'Could not open it');
    if (b.dataset.a === 'later') act('/api/later/add', { fromHistory: id }, 'Saved to watch later', 'Could not save it');
    if (b.dataset.a === 'del') act('/api/history/remove', { id });
    if (b.dataset.a === 'name') { const t = await ask('What was this?'); if (t) act('/api/history/rename', { id, title: t }, 'Renamed'); }
  });
  $('laterList').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; const id = b.closest('.row').dataset.id;
    if (b.dataset.a === 'open') act('/api/open', { later: id }, 'Opening on the TV', 'Could not open it');
    if (b.dataset.a === 'search') act('/api/open', { later: id, search: true }, 'Searching on the TV', 'Could not open it');
    if (b.dataset.a === 'del') act('/api/later/remove', { id }, 'Marked as watched');
  });
  $('appsGrid').addEventListener('click', e => { const b = e.target.closest('button[data-pkg]'); if (b) act('/api/open', { pkg: b.dataset.pkg }, 'Opening on the TV', 'Could not open it'); });
  let clearArmed = 0;
  $('clearHist').onclick = () => {
    if (Date.now() - clearArmed > 4000) { clearArmed = Date.now(); $('clearHist').textContent = 'Tap again to clear all history'; setTimeout(() => $('clearHist').textContent = 'Clear history', 4000); return; }
    clearArmed = 0; $('clearHist').textContent = 'Clear history'; act('/api/history', {}, 'History cleared', '', 'DELETE');
  };
  $('laterForm').onsubmit = async e => {
    e.preventDefault();
    const r = await act('/api/later/add', { title: $('lTitle').value, url: $('lUrl').value, pkg: $('lPkg').value }, 'Added', 'Add a title or a link');
    if (r?.ok) { $('lTitle').value = ''; $('lUrl').value = ''; }
  };
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
    tab = b.dataset.tab;
    document.querySelectorAll('[data-tab]').forEach(x => x.setAttribute('aria-selected', String(x === b)));
    ['history', 'later', 'apps'].forEach(t => $('tab-' + t).hidden = t !== tab);
    if (tab !== 'history' && !apps.length) act('sync');
  });
  $('forget').onclick = () => { store.del('code'); store.del('apps'); location.reload(); };

  // ---------- pairing / start ----------
  async function connect(code) {
    await setup(code); listen(); $('pair').hidden = true; $('app').hidden = false; renderApps(); render();
    const r = await act('sync');
    setConn(r !== null);
    return r !== null;
  }
  $('code').addEventListener('input', e => {
    const c = norm(e.target.value).slice(0, 16); e.target.value = c.replace(/(.{4})(?=.)/g, '$1-');
  });
  $('pairBtn').onclick = async () => {
    const c = norm($('code').value);
    if (c.length !== 16) { $('pairErr').textContent = 'The code has 16 letters and digits.'; return; }
    $('pairErr').textContent = '';
    store.set('code', c);
    const ok = await connect(c);
    if (!ok && !snap) toast('No answer yet. Check the code on the TV, and that the TV is on.');
  };
  $('code').addEventListener('keydown', e => { if (e.key === 'Enter') $('pairBtn').click(); });
  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && key) { listen(); act('sync'); } });

  if (!window.crypto?.subtle) { $('pair').hidden = false; $('pairErr').textContent = 'Open this page over https.'; return; }
  const saved = store.get('code');
  if (saved) connect(saved); else $('pair').hidden = false;
})();
</script>
</body>
</html>
